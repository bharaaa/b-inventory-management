<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- SEO -->
    <title>Crate Inventory</title>
    <meta
      name="description"
      content="Crate Inventory"
    />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/crate-logo.png" />

    <!-- Google Fonts: preconnect for faster font loading -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Prevent Dark Mode FOUC -->
    <script>
      (function() {
        try {
          var localTheme = localStorage.getItem('app-theme');
          var systemTheme = window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (localTheme === 'dark' || (!localTheme && systemTheme)) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-[var(--bg-main)] text-[var(--text-primary)] transition-colors duration-300">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
